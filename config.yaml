# ─────────────────────────────────────────────
#  핫딜 알리미 기본 설정
#  ※ 알림 키워드는 keywords.json 에 있습니다 (텔레그램에서 "OO 알림 해줘/꺼줘"로 관리)
# ─────────────────────────────────────────────

# 텔레그램 채팅 ID. 비워두면 봇에게 처음 메시지를 보낸 채팅을 자동으로 사용합니다.
chat_id: ""

# 확인할 사이트
sources:
  fmkorea: true   # 에펨코리아 핫딜
  ppomppu: true   # 뽐뿌게시판

# 제목에 들어 있으면 어떤 키워드든 무조건 제외
exclude_keywords: [품절, 삽니다, 구합니다, 강아지, 고양이, 반려견, 반려묘, 애견, 사료, 덴탈껌]

# 방해 금지 시간: 이 시간에는 수집도 알림도 하지 않음 (직접 보낸 명령의 답장만).
# 끝나는 시각에 밤사이 딜을 모아 첫 알림, 이후 묶음 알림은 9·12·15·18·21시와 시작 10분 전
quiet_hours: {start: "23:00", end: "07:30"}

# 사이트별 새 글 수집 간격(분). 키워드 딜은 모아서 3시간마다, ⚡·🔥 딜은 수집 즉시 알림
# 펨코는 보안 시스템이 잦은 자동 접속을 막으므로 간격을 길게 (막히면 1→2→4→8→12시간 쉬었다가 재시도)
collect_minutes: {fmkorea: 120, ppomppu: 30}

# 🔥 인기 딜: 키워드와 상관없이 올라온 지 max_age_hours 안에 추천(votes)이나 댓글(comments)이 기준을 넘으면 알림
popular:
  enabled: true
  max_age_hours: 8
  bargain_ratio: 0.85        # 단가 기준보다 이만큼(15%) 더 싸면 ⚡ 즉시 알림
  history_bargain_ratio: 0.8 # 최근 30일 가격 이력의 중간값보다 20% 이상 싸면 ⚡ 즉시 알림 (이력 5건 이상일 때)
  fmkorea: {votes: 30, comments: 60, pages: 2}   # pages: 인기 갱신을 위해 매번 볼 페이지 수
  ppomppu: {votes: 8, comments: 30, pages: 3}

# 명령 해석·연관어 생성에 쓰는 Gemini 모델 (앞에서부터 시도)
ai:
  models: [gemini-3.5-flash, gemini-3.1-flash-lite, gemini-2.5-flash]
